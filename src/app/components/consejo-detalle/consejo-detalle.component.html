<div class="consejo-detail-panel-duo animate__animated animate__fadeInUp">
  
  <!-- 🔝 BARRA DE CIERRE SUPERIOR ECO-TECH -->
  <header class="panel-top-bar-duo">
    <div class="decor-line-duo"></div>
    <button type="button" class="close-btn-duo" (click)="notificarCierre()">
      <ion-icon name="close-circle"></ion-icon>
    </button>
  </header>

  <!-- 📜 CUERPO DEL DETALLE CON HISTORIA -->
  <article class="detail-body-duo">
    <span class="detail-tag-duo">💡 Tip Ecológico</span>
    
    <h2>{{ consejo().titulo }}</h2>

    <!-- 🍃 El personaje acompaña la lectura del tip en un marco limpio -->
    <div class="character-row-duo">
      <app-hoja-animada [ancho]="200" [estado]="estadoActual()"></app-hoja-animada>
    </div>

    <div class="content-scroll-box">
      <p>{{ consejo().contenido }}</p>
    </div>
  </article>

  <!-- 🟢 BOTÓN INTERACTIVO 3D DE CONFIRMACIÓN -->
  <footer class="form-actions-duo">
    <button type="button" class="btn-duo-understood" (click)="notificarCierre()">
      ¡Entendido, gracias!
    </button>
  </footer>

</div>
