<!-- Barra Superior Corporativa Fija -->
<app-header></app-header>


<ion-content >
  <div class="consejos-container">
    
    <div class="intro-consejos-box">
      <div class="character-box">
        <img src="assets/images/img_12.png" alt="Hoja Verde Bienvenida">
      </div>
      <div class="intro-text">
        <h2>Consejos de Reciclaje</h2>
        <p>Aquí encontrarás ideas o consejos de cómo reciclar los alimentos para ayudar al medio ambiente</p>
      </div>
    </div>

    <!-- ⚡ @for dinámico: Itera el arreglo del Figma y pasa el objeto al hacer clic -->
    @for (item of listaConsejos; track item.titulo) {
      <div class="consejo-item-card">
        <h3>{{ item.titulo }}</h3>
        <p>{{ item.contenido.substring(0, 75) }}...</p>
        <div class="read-more-btn" (click)="abrirDetalle(item)">Leer +</div>
      </div>
    }

  </div>
</ion-content>

<!-- Menú de Pestañas Inferior -->
<app-menufooter></app-menufooter>

<!-- ========================================================================= -->
<!-- 🔼 OFFCANVAS MODAL DETALLE CONSEJO (Componente Hijo con Signal Input) -->
<!-- ========================================================================= -->
<ion-modal #modalDetalle [breakpoints]="" [initialBreakpoint]="0.75" style="--height: 75%; --border-radius: 30px 30px 0 0;">
  <ng-template>
    <ion-content>
      <!-- 🚀 Pasamos la Signal consejoSeleccionado() mediante su enlace de propiedad -->
      <app-consejo-detalle [consejo]="consejoSeleccionado()" (cerrarModal)="modalDetalle.dismiss()"></app-consejo-detalle>
    </ion-content>
  </ng-template>
</ion-modal>
