<!-- Barra Superior Corporativa Fija -->
<app-header></app-header>
<ion-content [fullscreen]="true">
  <div class="consejos-container-duo animate__animated animate__fadeIn">
    <app-backbutton pageTitle="Consejos de Reciclaje"></app-backbutton>
    <!-- 🫵 CABECERA INTERACTIVA CON EL PERSONAJE DE LA APP -->
    <header class="intro-consejos-box-duo">
      <div class="character-side-duo">
        <app-hoja-animada [ancho]="200" [estado]="estadoActual()"></app-hoja-animada>
      </div>
      
      <!-- Bocadillo de Diálogo estilo Comic / Academia -->
      <div class="dialog-bubble-duo">
        <h2>Academia UCC 🍃</h2>
        <p>¡Hola! Aquí encontrarás trucos e ideas geniales para reciclar tus alimentos y cuidar el planeta cada día.</p>
        <div class="bubble-arrow-left"></div>
      </div>
    </header>

    <!-- 📝 TARJETAS DE CONSEJOS (MISIONES DE CONOCIMIENTO) -->
    <section class="consejos-list-duo">
      @for (item of listaConsejos; track item.titulo) {
        <article class="consejo-item-card-duo animate__animated animate__fadeInUp">
          <div class="card-badge-info">💡 TIP</div>
          
          <h3>{{ item.titulo }}</h3>
          <p>{{ item.contenido.substring(0, 75) }}...</p>
          
          <div class="card-footer-duo">
            <!-- Botón de acción con relieve táctil sutil -->
            <button type="button" class="btn-read-more-duo" (click)="abrirDetalle(item)">
              Leer Más 
              <ion-icon name="arrow-forward-outline"></ion-icon>
            </button>
          </div>
        </article>
      }
    </section>

  </div>
</ion-content>

<!-- Menú de Pestañas Inferior -->

<!-- ========================================================================= -->
<!-- 🔼 OFFCANVAS MODAL DETALLE CONSEJO (Componente Hijo con Signal Input) -->
<!-- ========================================================================= -->
<ion-modal #modalDetalle [breakpoints]="" [initialBreakpoint]="0.75" style="--height: 75%; --border-radius: 30px 30px 0 0;">
  <ng-template>
    <ion-content>
      <!-- 🚀 Pasamos la Signal consejoSeleccionado() mediante su enlace de propiedad -->
      <app-consejo-detalle [consejo]="consejoSeleccionado()" (cerrarModal)="modalDetalle.dismiss()"></app-consejo-detalle>
    </ion-content>
  </ng-template>
</ion-modal>
