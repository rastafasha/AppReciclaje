<!-- Barra Superior Corporativa Fija -->
<app-header></app-header>


<ion-content>
  <div class="inicio-container">
    @if (isLoading()) {
    <app-skeleton-loader [rows]="7" [columns]="1" template="13"></app-skeleton-loader>
    } @else {
    <div class="inicio-container-duo animate__animated animate__fadeIn">

      <!-- 👤 HEADER DEL PERFIL: Monitoreo de Rango y Soporte -->
      <header class="welcome-section-duo">
        <div class="user-meta">
          <h2>¡Hola, {{ nombreUsuario() }}! 👋</h2>
          <div class="badge-rango-duo">
            <ion-icon name="ribbon"></ion-icon>
            <span>Nivel: {{ rango() }}</span>
          </div>
        </div>
        <button class="btn-help-duo" (click)="abrirInstrucciones()">
          <ion-icon name="help-circle-outline"></ion-icon>
        </button>
      </header>

      <!-- 📊 BARRA DE LOGRO DIARIO: Progreso de Impacto -->
      <section class="progress-section-duo">
        <div class="progress-text-duo">
          <span>Comidas Registradas</span>
          <strong>{{ totalComidas() }} / 63 🍽️</strong>
        </div>
        <!-- Barra tridimensional de progreso de lecciones -->
        <div class="progress-track-duo">
          <div class="progress-bar-duo" [style.width.%]="(totalComidas() / 63) * 100">
            <div class="progress-shine-duo"></div>
          </div>
        </div>
      </section>

      <!-- 🪺 MAPA DE MISIONES: Los Nodos de Hábitos Diarios -->
      <section class="habitos-map-duo">
        <h3 class="section-title-duo">Misiones de Hoy</h3>

        <div class="habitos-layout-duo">
          <!-- Lado izquierdo: El personaje que reacciona e interactúa con el usuario -->
          <div class="character-side-duo" (click)="cambiarEstado('feliz')">
            <app-hoja-animada [estado]="estadoActual()"></app-hoja-animada>
          </div>

          <!-- Lado derecho: Lista de lecciones / hábitos con relieve 3D -->
          <div class="habitos-nodes-duo">

            <button class="node-item-duo node-desayuno" id="open-formulario-avance" (click)="irAFormulario()">
              <div class="node-icon-box"><ion-icon name="pizza"></ion-icon></div>
              <div class="node-info">
                <h4>Desayuno</h4>
                <span>Registrar impacto</span>
              </div>
            </button>

            <button class="node-item-duo node-almuerzo" id="open-formulario-avance" (click)="irAFormulario()">
              <div class="node-icon-box"><ion-icon name="restaurant"></ion-icon></div>
              <div class="node-info">
                <h4>Almuerzo</h4>
                <span>Sumar puntos</span>
              </div>
            </button>

            <button class="node-item-duo node-cena" id="open-formulario-avance" (click)="irAFormulario()">
              <div class="node-icon-box"><ion-icon name="restaurant"></ion-icon></div>
              <div class="node-info">
                <h4>Cena</h4>
                <span>Cerrar racha</span>
              </div>
            </button>

          </div>
        </div>
      </section>

      <!-- 🔵 SECCIÓN DE RECOMPENSAS: Accesos Rápidos Gamificados -->
      <section class="rewards-actions-duo">
        <button class="btn-duo-action btn-blue-duo" id="open-mi-puntaje" (click)="verMiPuntaje()">
          <ion-icon name="trophy"></ion-icon> Ver Mi Puntaje
        </button>

        <!-- Botonera de Navegación -->
        <!-- <ion-button class="btn-duo-action btn-blue-duo" id="open-formulario-avance">
          ir a Formulario
        </ion-button> -->
        <button class="btn-duo-action btn-gray-duo" (click)="irAlHistorial()">
          <ion-icon name="document-text-outline"></ion-icon> Historial UCC
        </button>
      </section>

      <!-- 📝 IMPULSO DE CONOCIMIENTO: El consejo del día -->
      <footer class="consejo-card-duo">
        <div class="consejo-header">
          <span>💡 TIP ECOLÓGICO</span>
        </div>
        <p>Lorem ipsum dolor sit amet, consectetuer adipiscing elit, sed diam nonummy nibh euismod...</p>
        <span class="read-more-duo" (click)="irAlConsejos()">Leer +</span>
      </footer>

    </div>
    }






  </div>
</ion-content>

<!-- 🗺️ MENÚ DE PESTAÑAS INFERIOR (Tabs Bar Calcada del Figma) -->
<app-menufooter [tabActiva]="'inicio'"></app-menufooter>

<!-- 🏆 MODAL 1: BIENVENIDA -->
<app-modal-bienvenida 
  [isOpen]="mostrarModalBienvenida()" 
  keepContentsMounted="true"
  (cerrar)="cerrarBienvenida()">
</app-modal-bienvenida>

<!-- 📖 MODAL 2: INSTRUCCIONES -->
<app-modal-instrucciones 
  [isOpen]="mostrarModalInstrucciones()" 
  keepContentsMounted="true"
  (cerrar)="cerrarInstrucciones()">
</app-modal-instrucciones>

<!-- 🟢 MODAL 3: FORMULARIO DE AVANCE (Misión diaria) -->
<ion-modal 
  [isOpen]="mostrarModalFormularioAvance()" 
  [initialBreakpoint]="1"
[breakpoints]="[0, 1]"
  keepContentsMounted="true"
  (didDismiss)="onModalFormularioCerrado()"
  class="binance-sheet-modal">
  <ng-template>
    <!-- Capturamos la salida output () del formulario real para detonar el cierre -->
    <app-formulario-avance (cerrarModal)="onModalFormularioCerrado()"></app-formulario-avance>
  </ng-template>
</ion-modal>

<!-- 📊 MODAL 4: MI PUNTAJE CENTRAL -->
<ion-modal 
  [isOpen]="mostrarModalMiPuntaje()" 
  [initialBreakpoint]="0.95" 
  [breakpoints]="[0, 0.95, 0.95]"
  keepContentsMounted="true"
  (didDismiss)="onModalPuntajeCerrado()"
  class="binance-sheet-modal">
  <ng-template>
    <!-- Capturamos la salida output () de mi puntaje para detonar el cierre -->
    <app-mi-puntaje (cerrarModal)="onModalPuntajeCerrado()"></app-mi-puntaje>
  </ng-template>
</ion-modal>
