<ion-content >
  <div class="register-container">
    
    <!-- Bolso de Reciclaje -->
    <div class="logo-area">
      <img src="assets/svg/logo.svg" alt="App Reciclaje Logo">
    </div>

    <!-- 🧭 STEPPER VISUAL (Cambia de color según la Signal pasoActual()) -->
    <div class="stepper-container">
      <div class="step-circle" [class.active-yellow]="pasoActual() === 1 || pasoActual() === 2">1</div>
      <div class="step-line"></div>
      <div class="step-circle" [class.active-blue]="pasoActual() === 2">2</div>
    </div>

    <!-- Formulario Reactivo Único -->
    <form [formGroup]="registerForm">
      
      <!-- 📋 INTERFAZ PASO 1 -->
      @if (pasoActual() === 1) {
        <div class="input-group">
          <label>Nombre de Usuario</label>
          <ion-input class="custom-input" type="text" formControlName="username"></ion-input>
        </div>

        <div class="input-group">
          <label>Identificación</label>
          <ion-input class="custom-input" type="text" formControlName="identificacion" placeholder="Ej: V-12345678"></ion-input>
        </div>

        <ion-button expand="block" class="btn-primary" (click)="irAlPaso(2)" style="margin-top: 30px;">
          Siguiente
        </ion-button>
      }

      <!-- 📋 INTERFAZ PASO 2 -->
      @if (pasoActual() === 2) {
        <div class="input-group">
          <label>Correo Electrónico</label>
          <ion-input class="custom-input" type="email" formControlName="email"></ion-input>
        </div>

        <div class="input-group">
          <label>Contraseña</label>
          <ion-input class="custom-input" type="password" formControlName="password"></ion-input>
        </div>

        <div class="input-group">
          <label>Confirme Contraseña</label>
          <ion-input class="custom-input" type="password" formControlName="confirmPassword"></ion-input>
        </div>

        <div class="buttons-row" style="margin-top: 30px;">
          <ion-button class="btn-gray" (click)="irAlPaso(1)">
            Anterior
          </ion-button>
          <ion-button class="btn-submit" (click)="onRegistrar()">
            Registrarme
          </ion-button>
        </div>
      }

      <!-- Divisor ó -->
      <div class="divider">ó</div>

      <!-- Botón Ingresar inferior -->
      <ion-button expand="block" class="btn-secondary" fill="clear" (click)="irAlLogin()">
        Ingresar
      </ion-button>

    </form>
  </div>
</ion-content>
