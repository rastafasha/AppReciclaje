<app-header></app-header>
<ion-content [fullscreen]="true">
  <div class="bienvenida-container-duo">
    
    <!-- 🏛️ Encabezado Superior Grueso -->
    <h2 class="page-title-duo">¡Tu Desafío Comienza! ♻️</h2>

    <!-- ✉️ Bocadillo de Diálogo Estilo Duolingo (Mensaje flotante con relieve) -->
    <div class="dialog-bubble-duo animate__animated animate__fadeInUp">
      <div class="bubble-body">
        <h3>¡Hola, {{ nombreUsuario() }}! 👋</h3>
        <p>Para poder registrar tus hábitos de reciclaje, acumular puntos para los premios de <strong>Mercadona / UCC</strong> y clasificar en los sorteos, necesitamos que completes tu perfil.</p>
      </div>
      <!-- Flecha decorativa inferior que apunta al personaje -->
      <div class="bubble-arrow"></div>
    </div>

    <!-- 🔵 Botón de Acción con Relieve 3D Gigante -->
    <button class="btn-duo-primary" (click)="irACompletarPerfil()">
      Completar Mi Perfil
    </button>

    <!-- 🍃 Personaje de la Hoja Animada en el Fondo -->
    <div class="character-box">
      <app-hoja-animada></app-hoja-animada>
    </div>

  </div>
</ion-content>
