<!-- 🏔️ Barra Superior idéntica al Figma -->
<app-header></app-header>

<ion-content >
  <div class="bienvenida-container">
    
    <!-- Título de Sección -->
    <h2 class="page-title">Mi Cuenta</h2>

    <!-- Tarjeta de Mensaje Inicial -->
    <div class="alert-card">
      <p>Bienvenido {{ nombreUsuario() }}!.<br>Agradecemos que completes tu perfil para poder disfrutar de la mejor experiencia</p>
    </div>

    <!-- Botón de Acción -->
    <ion-button expand="block" class="btn-complete" (click)="irACompletarPerfil()">
      Completar Perfil
    </ion-button>

    <!-- 🍃 Render Temporal del Personaje Estático antes de meterle el Lottie JSON -->
    <div class="character-placeholder">
      <img src="assets/images/img_12.png" alt="Hoja Verde Bienvenida">
    </div>

  </div>
</ion-content>
