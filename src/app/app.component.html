<!-- 📱 CONTENEDOR PRINCIPAL DE IONIC -->
<ion-app>

  <!-- 🍔 EL MENÚ LATERAL DESLIZABLE GLOBAL (side="end" o side="start" según tu Figma) -->
  <ion-menu contentId="main-app-content" menuId="main-menu" side="end">
    <ion-content>

      <!-- Cabecera del Menú con Perfil -->
      <div class="menu-header-box">
        <div class="menu-avatar-container" (click)="navegarA('perfil-editar')">

          @if (authService.usuarioActual()?.profile?.avatar_url) {
          <!-- 📸 Imagen real traída desde Cloudinary mediante el Pipe unificado -->
          <img [src]="authService.usuarioActual()!.profile!.avatar_url! | imagenPipe:'perfiles'"
            alt="Avatar del Retador">
          } @else {
          <!-- 👤 Imagen predeterminada si el usuario no tiene avatar guardado -->
          <img src="assets/images/default.jpeg" alt="Predeterminado">
          }

        </div>
        <h3 >¡Hola, {{ nombreUsuario() }}! 👋</h3>
        <p >UCC Premia tu reciclaje</p>
      </div>

      <!-- Lista de Opciones de Navegación del Figma -->
      <div class="menu-list-items" >

        <div class="menu-item-row" (click)="navegarA('reglas')">
          <ion-icon name="trophy-outline" style="font-size: 22px; color: #252876;"></ion-icon>
          <span>Reglas del Concurso</span>
        </div>

        <div class="menu-item-row" (click)="navegarA('consejos')">
          <ion-icon name="document-text-outline" style="font-size: 22px; color: #252876;"></ion-icon>
          <span>Términos y Condiciones</span>
        </div>

        <div class="menu-item-row" (click)="cerrarSesion()"  >
          <ion-icon name="power-outline" style="font-size: 22px; color: #f3a91b;"></ion-icon>
          <span>Cerrar Sesión</span>
        </div>

      </div>

    </ion-content>
  </ion-menu>

  <!-- 📺 CONTENEDOR FÍSICO QUE SE DESPLAZA -->
  <div id="main-app-content" class="ion-page">
    <ion-router-outlet></ion-router-outlet>
    <app-pwa-notif-installer></app-pwa-notif-installer>
  </div>

</ion-app>
