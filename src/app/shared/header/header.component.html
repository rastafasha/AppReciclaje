

<!-- 🏔️ CABECERA COMPARTIDA CORREGIDA CON ENLACES VISIBLES -->
<ion-header class="custom-header">
  <ion-toolbar>
    <div class="header-container">
      @if (enRegistro) {
        <!-- Texto plano sin enlaces interactivos -->
        <!-- <span class="app-title-locked">Completar Perfil ♻️</span> -->
        <img src="assets/svg/logotipo.svg" class="brand-logo" alt="App Reciclaje Logo" >
      } @else {
        <!-- Enlace nativo al home para usuarios validados -->
        <img src="assets/svg/logotipo.svg" class="brand-logo" alt="App Reciclaje Logo" routerLink="/inicio">
      }
      <!-- Logotipo UCC Premia tu Reciclaje (Lado Izquierdo) -->

      <!-- Bloque de Acciones (Lado Derecho) -->
      <div class="header-actions">

        @if (enRegistro) {
          <!-- 🚪 Única acción permitida si no ha terminado el formulario -->
          <ion-button color="danger" (click)="logout()">
            <ion-icon slot="start" name="log-out-outline"></ion-icon>
            Salir
          </ion-button>
        } @else {
          <!-- 🔔 1. Icono de la Campana (Con su clase asignada) -->
          <div slot="end" class="bell-wrapper" (click)="irANotificaciones()">
            <ion-icon name="notifications-outline" class="icon-bell" ></ion-icon>
            <!-- 🛑 Globo de Alerta Reactivo: Solo aparece si hay mensajes en Atlas -->
            @if (contadorAlertas() > 0) {
              <ion-badge color="danger" class="campana-badge">
                {{ contadorAlertas() }}
              </ion-badge>
            }
          </div>
          <!-- 🍔 2. Menú Hamburguesa (Con la clase icon-menu para que aparezca en pantalla) -->
        <ion-menu-toggle menu="main-menu">
          <ion-icon name="menu-outline" class="icon-menu"></ion-icon>
        </ion-menu-toggle>
        }
        
       
        
        
      </div>
    </div>
  </ion-toolbar>
</ion-header>
